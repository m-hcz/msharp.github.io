<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GitHub Pages serves this file for any missing URL, at any depth, so paths start at the root -->
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/carousel.css">
    <link rel="stylesheet" href="/css/project-colors.css">

    <meta name="robots" content="noindex">

    <title>MSharp - Page not found</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>

<body>
    <div class="page">
        <div class="main">
            <a class="msharp-logo profile-colors" href="/" aria-label="MSharp home">
                <svg width="90" height="70" aria-hidden="true"><use href="/images/icons.svg#logo" /></svg>
            </a>

            <div class="profile-full">
                <div class="profile flex-column-center">
                    <h1>Page not found.</h1>
                    <a class="weblink" href="/">Back to the portfolio</a>
                </div>
            </div>
        </div>

        <footer class="profile-colors">
            <p class="note">Copyright Ⓒ <span id="year"></span>. All Rights Reserved.</p>
            <div>
                <a href="mailto:info@msharp.cz" aria-label="E-mail">
                    <svg width="30" height="30" aria-hidden="true"><use href="/images/icons.svg#mail" /></svg>
                </a>
                <a href="https://github.com/m-hcz" target="_blank" aria-label="GitHub">
                    <svg width="30" height="30" aria-hidden="true"><use href="/images/icons.svg#github" /></svg>
                </a>
            </div>
        </footer>
    </div>
    <script src="/js/scripts.js"></script>
</body>

</html>
